<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Minishell — Unix shell illustration</title>
  <rect width="640" height="360" fill="#dce3ce"/>
  <text x="594" y="57" fill="#344932" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="end">minishell<tspan fill="#a33e33" font-family="monospace"> $_</tspan></text>
  <rect x="45" y="85" width="550" height="246" rx="10" fill="#1f2a24" stroke="#b6c5a6"/>
  <path d="M45 95a10 10 0 0 1 10-10h530a10 10 0 0 1 10 10v20H45z" fill="#2c3a32"/>
  <g><circle cx="68" cy="100" r="5" fill="#d9725a"/><circle cx="86" cy="100" r="5" fill="#e3b85a"/><circle cx="104" cy="100" r="5" fill="#8fbf7a"/></g>
  <g font-family="monospace" font-size="15">
    <text x="66" y="148" fill="#8fbf7a">minishell$ <tspan fill="#eef1e6">ls -l | grep .c | wc -l</tspan></text>
    <text x="66" y="172" fill="#c9d3c2">12</text>
    <text x="66" y="202" fill="#8fbf7a">minishell$ <tspan fill="#eef1e6">cat &lt;&lt; EOF &gt; out.txt</tspan></text>
    <text x="66" y="226" fill="#c9d3c2">&gt; hello, world!</text>
    <text x="66" y="250" fill="#c9d3c2">&gt; EOF</text>
    <text x="66" y="280" fill="#8fbf7a">minishell$ <tspan fill="#eef1e6">echo $?</tspan></text>
    <text x="66" y="304" fill="#c9d3c2">0</text>
  </g>
  <rect x="160" y="290" width="9" height="17" fill="#eef1e6" opacity=".8"/>
  <g font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#344932">
    <rect x="438" y="133" width="136" height="26" rx="13" fill="#f8e2d0"/><text x="506" y="150" text-anchor="middle">pipes</text>
    <rect x="438" y="167" width="136" height="26" rx="13" fill="#deebcf"/><text x="506" y="184" text-anchor="middle">redirections</text>
    <rect x="438" y="201" width="136" height="26" rx="13" fill="#eddef0"/><text x="506" y="218" text-anchor="middle">fork / execve</text>
    <rect x="438" y="235" width="136" height="26" rx="13" fill="#e3e8f5"/><text x="506" y="252" text-anchor="middle">signals</text>
  </g>
</svg>
